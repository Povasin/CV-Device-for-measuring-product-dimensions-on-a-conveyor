[project]
name = "ozon-conveyor-dimensioning"
version = "0.1.0"
description = "Metric 3D measurement pipeline for Ozon Tech CV test, variant 1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3.0",
    "opencv-python>=4.10,<5.0",
    "open3d==0.19.0",
    "pydantic>=2.10,<3.0",
    "reportlab>=4.2,<5.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ozon_dim"]

[dependency-groups]
dev = [
    "mypy>=1.15,<2.0",
    "pre-commit>=4.0,<5.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["open3d", "reportlab.*"]
ignore_missing_imports = true
